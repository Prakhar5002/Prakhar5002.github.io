<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio browser check</title>
    <style>iframe { border: 0; display: block; position: absolute; top: 0; left: 0; } /* all frames on-screen so Chrome keeps firing scroll/IO events */</style>
  </head>
  <body>
    <pre id="out">pending</pre>
    <script>
      /* Loads ../index.html in iframes at several widths and writes layout + behaviour facts as JSON into #out.
       * Run via tools/run_browser_check.sh (needs Chrome's --allow-file-access-from-files). */
      (function () {
        var frames = [
          { key: '320', w: 320, src: '../index.html' },
          { key: '360', w: 360, src: '../index.html' },
          { key: '390', w: 390, src: '../index.html' },
          { key: '768', w: 768, src: '../index.html' },
          { key: '1024', w: 1024, src: '../index.html' },
          { key: '1440', w: 1440, src: '../index.html' },
          { key: 'dark1024', w: 1024, src: '../index.html?theme=dark' },
          { key: 'brokenjs', w: 1024, src: '../.broken-js-check.html', wait: 3500 }
        ];
        var results = {};
        var pending = frames.length;
        function done(key, r) {
          results[key] = r;
          if (--pending === 0) document.getElementById('out').textContent = JSON.stringify(results);
        }
        frames.forEach(function (fr) {
          var f = document.createElement('iframe');
          f.width = String(fr.w);
          f.height = '900';
          f.src = fr.src;
          f.onload = function () {
            setTimeout(function () {
              var r = { w: fr.w };
              try {
                var d = f.contentDocument, win = f.contentWindow;
                r.scrollWidth = d.documentElement.scrollWidth;
                r.revealOpacity = win.getComputedStyle(d.querySelector('#experience .reveal')).opacity;
                if (fr.key === 'brokenjs') return done(fr.key, r);
                r.theme = d.documentElement.getAttribute('data-theme');
                r.bodyBg = win.getComputedStyle(d.body).backgroundColor;
                r.menuBtnVisible = win.getComputedStyle(d.getElementById('menu-toggle')).display !== 'none';
                r.navLinksVisible = win.getComputedStyle(d.querySelector('.nav-links')).display !== 'none';
                var mb = d.getElementById('menu-toggle'), mm = d.getElementById('mobile-menu');
                if (r.menuBtnVisible) {
                  mb.click();
                  r.menuOpens = mm.hidden === false && mb.getAttribute('aria-expanded') === 'true';
                  d.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape' }));
                  r.escCloses = mm.hidden === true && mb.getAttribute('aria-expanded') === 'false';
                }
                if (fr.key !== '1440') return done(fr.key, r);
                var t = d.getElementById('theme-toggle');
                t.click();
                r.toggledTo = d.documentElement.getAttribute('data-theme');
                r.toggleLabel = t.getAttribute('aria-label');
                t.click();
                r.toggledBack = d.documentElement.getAttribute('data-theme');
                r.activeAtTop = (d.querySelector('.nav-links a.is-active') || {}).textContent || null;
                r.year = (d.querySelector('[data-year]') || {}).textContent || null;
                win.scrollTo({ top: d.documentElement.scrollHeight, behavior: 'instant' }); // page uses smooth scroll; jump instantly
                win.dispatchEvent(new win.Event('scroll')); // headless virtual time does not deliver scroll events to frames
                setTimeout(function () {
                  r.activeAtBottom = (d.querySelector('.nav-links a.is-active') || {}).textContent || null;
                  done(fr.key, r);
                }, 800);
              } catch (e) {
                r.error = String(e);
                done(fr.key, r);
              }
            }, fr.wait || 1200);
          };
          document.body.appendChild(f);
        });
      })();
    </script>
  </body>
</html>
